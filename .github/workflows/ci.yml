name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Mise-driven (`mise run test`): cargo-llvm-cov runs the full test suite
  # (unit + tests/*.rs integration) with a statement-coverage floor gate
  # (mise.toml). The floor is a ratchet at the current achieved level
  # (75%), not 100% -- main.rs's process/signal-handling glue, and
  # ct/watcher.rs's and ct/static_ct.rs's live CT-log-fetch loops, are the
  # remaining gap and would need substantially more mocking work to close.
  test:
    name: Test (statement-coverage floor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # tests/server_e2e.rs spawns this and skips itself if it's missing.
      - name: Build release binary
        run: cargo build --release

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Run tests
        run: mise run test

  # Same "container integrity" gate as merkleye/certspotter and
  # merkleye/dnstwist's container-build jobs — actually builds the
  # Dockerfile referenced from merkleye/merkleye's deploy/docker-compose.yml,
  # rather than trusting that it merely parses.
  container-build:
    name: Build certstream-server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build certstream-server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: certstream-server:ci
          cache-from: type=gha,scope=certstream-server
          cache-to: type=gha,mode=max,scope=certstream-server
